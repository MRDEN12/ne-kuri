<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Не курю — трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0e1013;--card:#171a1f;--card2:#1e2228;--line:#272c33;--txt:#e8ebef;--dim:#8b949e;
  --acc:#34d399;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--sky:#0b1220;
}
body[data-theme="light"]{--bg:#f2f4f7;--card:#ffffff;--card2:#f6f8fa;--line:#e3e8ee;--txt:#12161c;--dim:#66707a;--sky:#dbeafe}
body[data-theme="mid"]{--bg:#141a20;--card:#1c242c;--card2:#222c35;--line:#2c3843;--txt:#e6edf3;--dim:#94a3b0;--sky:#16222e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Segoe UI,sans-serif;font-size:16px}
body{padding-bottom:80px;overscroll-behavior:none}
.wrap{padding:14px 14px 0}
h1{font-size:17px;margin:0;font-weight:600}
h2{font-size:20px;margin:6px 0}
.sub{color:var(--dim);font-size:12.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px}
.big small{font-size:16px;color:var(--dim);font-weight:500;letter-spacing:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}.center{justify-content:center}
.muted{color:var(--dim);font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .35s}
button{font-family:inherit;font-size:15px;border:none;border-radius:12px;padding:13px 16px;color:#08130d;background:var(--acc);font-weight:600;cursor:pointer;transition:transform .06s}
button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
button.warn{background:var(--warn);color:#231a00}
button.bad{background:var(--bad);color:#2a0b0b}
button.sm{padding:9px 12px;font-size:13.5px;border-radius:10px}
button.wide{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px}
.stat b{display:block;font-size:21px;margin-top:2px}
.stat span{font-size:11.5px;color:var(--dim)}
.stat.tap{cursor:pointer}
.step{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.step:last-child{border:none}.step .d{color:var(--dim)}.step.now{color:var(--acc);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.chart .col i{width:100%;border-radius:5px 5px 0 0;background:var(--acc);min-height:3px;transition:height .3s}
.chart .col i.over{background:var(--bad)}.chart .col i.empty{background:var(--card2)}
.chart .col span{font-size:10px;color:var(--dim)}
.badge{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.badge:last-child{border:none}.badge.off{opacity:.35}.badge .e{font-size:20px;width:26px;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;color:var(--dim);text-decoration:none;font-size:10.5px;padding:5px 0;border-radius:12px}
.nav a.on{color:var(--acc)}.nav a .i{display:block;font-size:20px;line-height:1.25}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit}
label{font-size:12.5px;color:var(--dim);display:block;margin:10px 0 5px}
.hero{text-align:center;padding:22px 16px}
.fire{font-size:30px}
.timer{font-size:56px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.note{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13.5px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:120;overflow:auto}
.modal.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}
.fine{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.45);color:var(--bad);border-radius:12px;padding:13px;margin-top:12px;font-size:19px;font-weight:700}
.wish{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;opacity:.5}
.wish:last-of-type{border:none}.wish.ok{opacity:1}.wish .e{font-size:20px;width:24px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--acc);color:#08130d;border-color:transparent;font-weight:600}
/* сад */
.scene{border-radius:16px;padding:18px;text-align:center;position:relative;overflow:hidden;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.scene[data-bg="day"]{background:linear-gradient(#bfe3ff,#e8f5e9)}
.scene[data-bg="sunset"]{background:linear-gradient(#ffb27a,#ffe3c2,#f5e6c8)}
.scene[data-bg="night"]{background:linear-gradient(#0b1220,#1b2740,#243352)}
.scene[data-bg="space"]{background:linear-gradient(#0a0a1f,#1a1030,#2a1548)}
.tree{font-size:76px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:font-size .4s}
.grass{font-size:22px;letter-spacing:6px;opacity:.9}
.decor{position:absolute;font-size:24px}
.leaves{font-size:13px;color:var(--dim)}
.shopitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.shopitem:last-child{border:none}.shopitem .e{font-size:26px;width:34px;text-align:center}
/* анимации сада */
.scene{overflow:hidden;min-height:270px}
.tree{position:relative;z-index:2;transform-origin:50% 100%;animation:grow .9s ease-out,sway 5s ease-in-out infinite}
@keyframes grow{from{transform:scale(.35);opacity:.15}}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.grass{position:relative;z-index:2;transform-origin:50% 100%;animation:grass 3.4s ease-in-out infinite}
@keyframes grass{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-2px)}}
.leaves{position:relative;z-index:3}
.sun{position:absolute;z-index:1;top:7%;left:12%;font-size:30px;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.cloud{position:absolute;z-index:1;top:9%;left:-20%;font-size:26px;animation:drift linear infinite;animation-duration:22s}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(540%)}}
.star{position:absolute;z-index:1;font-size:9px;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.leaf{position:absolute;z-index:1;top:-6%;font-size:15px;animation:fall linear infinite;will-change:transform}
@keyframes fall{0%{transform:translateY(-24px) rotate(0)}100%{transform:translateY(250px) rotate(340deg)}}
.decor{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.fly{position:absolute;z-index:1;font-size:15px;bottom:30%;left:-8%;animation:fl linear infinite;animation-duration:17s}
@keyframes fl{0%{left:-8%;bottom:28%}50%{bottom:38%}100%{left:106%;bottom:30%}}
.firefly{position:absolute;z-index:1;font-size:9px;animation:ff 4s ease-in-out infinite}
@keyframes ff{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:1;transform:translateY(-14px)}}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;border-radius:16px}
.decor img{width:46px;height:auto;display:block}
.fly img{width:38px;height:auto}
.tree{max-width:76%;height:auto}
/* фоны (заменяют градиент, если файл есть) */
.scene{background-size:cover;background-position:center}
.scene[data-bg="day"]{background-image:url('assets/bg_day.jpg')}
.scene[data-bg="sunset"]{background-image:url('assets/bg_sunset.jpg')}
.scene[data-bg="night"]{background-image:url('assets/bg_night.jpg')}
.scene[data-bg="space"]{background-image:url('assets/bg_space.jpg')}
/* чат */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--acc);color:#08130d;border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.typing{color:var(--dim);font-style:italic}
.chatinput{position:fixed;left:0;right:0;bottom:80px;display:flex;gap:8px;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line)}
.chatinput textarea{height:44px;padding:11px 12px;resize:none}
</style>
</head>

<script>
window.__err=function(m){try{var d=document.getElementById('app');if(d)d.innerHTML='<div class="card">⚠️ Ошибка: '+m+'</div>'+d.innerHTML;}catch(e){}};
window.onerror=function(m,s,l){window.__err(String(m)+' ['+s+':'+l+']');return false;};
window.addEventListener('unhandledrejection',function(e){window.__err('Promise: '+((e.reason&&e.reason.message)||e.reason));});
</script>
<script>
const APP_VER='v3 · 25.09.2026';
const APP_ID='20260925221734';
const TG=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#0e1013');TG.enableClosingConfirmation&&TG.enableClosingConfirmation();}catch(e){}}
const haptic=t=>{try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred(t||'light');}catch(e){}};
let API_BASE='';
(function(){try{fetch('api.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d&&d.base)API_BASE=String(d.base).replace(/\/$/,'');}).catch(()=>{});}catch(e){}})();

const DAY=86400000,pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(new Date());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);
const human=s=>{const a=s.split('-');return a[2]+'.'+a[1]+'.'+a[0];};
const MIN_PER_STICK=6;

const PENALTY_PRESETS=[
 {k:'pushup',n:'Отжимания',u:'раз',min:10,max:20,step:2},
 {k:'squat',n:'Приседания',u:'раз',min:15,max:30,step:5},
 {k:'plank',n:'Планка',u:'сек',min:30,max:90,step:10},
 {k:'cold',n:'Холодный душ',u:'мин',min:2,max:5,step:1},
 {k:'water',n:'Два стакана воды',u:'',min:0,max:0,step:1}];
const TRIGGERS=['Стресс','Скука','После еды','Кофе','Компания','Алкоголь','Недосып','Машина','Усталость'];
const HELPERS=['Вода','Прогулка','Дыхание','Отвлёкся','Жвачка','Потерпел','Написал Оскару'];
const WISH=[
 {e:'☕',n:'Кофе в кофейне',p:900},{e:'🍜',n:'Обед в кафе',p:4000},{e:'🎬',n:'Кино на двоих',p:5000},
 {e:'🧵',n:'Катушка PLA (1 кг)',p:6000},{e:'🌶️',n:'Катушка PETG-CF',p:12000},{e:'🍣',n:'Ужин в ресторане',p:18000},
 {e:'🏋️',n:'Месяц спортзала',p:20000},{e:'🔩',n:'Катушка PA6-CF',p:25000},{e:'🎧',n:'Хорошие наушники',p:60000},
 {e:'📱',n:'Новый смартфон',p:250000},{e:'🖨️',n:'Ещё один P1S',p:450000},{e:'💻',n:'Игровой ноутбук',p:900000}];
const SHOP=[
 {id:'bird',cat:'decor',e:'🐦',n:'Птичка',p:20},{id:'lantern',cat:'decor',e:'🏮',n:'Фонарик',p:35},
 {id:'turtle',cat:'decor',e:'🐢',n:'Черепаха',p:40},{id:'kite',cat:'decor',e:'🪁',n:'Змей',p:45},
 {id:'fountain',cat:'decor',e:'⛲',n:'Фонтан',p:55},{id:'fireflies',cat:'decor',e:'✨',n:'Банка светлячков',p:60},
 {id:'rainbow',cat:'decor',e:'🌈',n:'Радуга',p:80},{id:'gnome',cat:'decor',e:'🧙',n:'Гномик',p:90},
 {id:'day',cat:'bg',e:'☀️',n:'День',p:0},{id:'sunset',cat:'bg',e:'🌇',n:'Закат',p:40},
 {id:'night',cat:'bg',e:'🌙',n:'Ночь',p:60},{id:'space',cat:'bg',e:'🌌',n:'Космос',p:100}];
const ACCENTS={green:'#34d399',blue:'#60a5fa',violet:'#a78bfa',pink:'#f472b6',orange:'#fb923c',red:'#f87171'};

const DEFAULT={v:3,startDate:today(),quitDate:null,plan:{startLimit:20,step:2,everyDays:7},
 manualLimit:{},log:{},cravings:[],penalties:[],slips:[],chat:[],challenge:{},wish:null,
 garden:{leaves:0,tree:'oak',decor:[],bg:'day',lastTick:null,bought:{oak:1,day:1}},
 settings:{pricePerStick:38,cur:'₸',activeHours:16,cooldownMode:'auto',cooldownMin:50,penaltyOn:true,
           theme:'dark',accent:'green',quietFrom:23,quietTo:8,sound:'none'}};
let state=JSON.parse(JSON.stringify(DEFAULT)),tab='today',cdTick=null,cdFired=false,cdInit=false,sosTimer=null;

function merge(o){state=Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),o||{});
 state.plan=Object.assign({},DEFAULT.plan,(o&&o.plan)||{});
 state.settings=Object.assign({},DEFAULT.settings,(o&&o.settings)||{});
 state.garden=Object.assign({},DEFAULT.garden,(o&&o.garden)||{});
 state.garden.bought=Object.assign({oak:1,day:1},(o&&o.garden&&o.garden.bought)||{});
 state.wish=(o&&o.wish)?o.wish:JSON.parse(JSON.stringify(WISH));}
function save(){const s=JSON.stringify(state);if(TG&&TG.CloudStorage){TG.CloudStorage.setItem('nk_state',s,()=>{});}try{localStorage.setItem('nk_state',s);}catch(e){}}
function load(cb){if(TG&&TG.CloudStorage){TG.CloudStorage.getItem('nk_state',(e,v)=>{if(v){try{merge(JSON.parse(v));}catch(x){}}else{try{const l=localStorage.getItem('nk_state');if(l)merge(JSON.parse(l));}catch(x){}}cb&&cb();});}
 else{try{const l=localStorage.getItem('nk_state');if(l)merge(JSON.parse(l));}catch(e){}cb&&cb();}}

/* ---------- домен ---------- */
function limitFor(ds){if(state.manualLimit[ds]!=null)return state.manualLimit[ds];
 const di=diffDays(state.startDate,ds);if(di<0)return state.plan.startLimit;
 if(state.quitDate){const qi=diffDays(state.startDate,state.quitDate);if(di>=qi)return 0;}
 return Math.max(0,state.plan.startLimit-Math.floor(di/state.plan.everyDays)*state.plan.step);}
const smokedOn=d=>(state.log[d]||[]).length;
const lastTs=d=>{const a=state.log[d]||[];return a.length?a[a.length-1]:null;};
function lastAny(){let m=0;for(const k in state.log)for(const t of state.log[k])if(t>m)m=t;return m||0;}
function cooldownMin(){const s=state.settings,L=currentLimit();
 if(L<=0)return Math.max(1,(+s.activeHours||16)*60);
 if(s.cooldownMode==='manual')return Math.max(1,+s.cooldownMin||1);
 return Math.max(1,Math.round((+s.activeHours||16)*60/L));}
const cooldownMs=()=>cooldownMin()*60000;
function cooldownLeft(){const t=lastAny();return t?Math.max(0,t+cooldownMs()-Date.now()):0;}
const currentLimit=()=>limitFor(today());
function nextStep(){const L=currentLimit();for(let i=1;i<=120;i++){const d=new Date();d.setDate(d.getDate()+i);const l=limitFor(fmtD(d));if(l<L)return{date:fmtD(d),limit:l};}return null;}
function zeroDate(){for(let i=0;i<=400;i++){const d=new Date();d.setDate(d.getDate()+i);if(limitFor(fmtD(d))===0)return fmtD(d);}return null;}
function streakUnder(){let n=0;const d=new Date();for(let i=0;i<400;i++){const ds=fmtD(d);const s=smokedOn(ds);if(s===0&&i>0){d.setDate(d.getDate()-1);continue;}if(s<=limitFor(ds))n++;else break;d.setDate(d.getDate()-1);}return n;}
function daysFree(){if(!state.quitDate)return 0;const q=parseD(state.quitDate);const t=new Date();q.setHours(0,0,0,0);t.setHours(0,0,0,0);let n=Math.floor((t-q)/DAY);if(n<0)return 0;for(let i=0;i<=n;i++){const d=new Date(q);d.setDate(d.getDate()+i);if(smokedOn(fmtD(d))>0)return 0;}return n;}
function total(){let t=0;for(const k in state.log)t+=state.log[k].length;return t;}
function avg7(){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);s+=smokedOn(fmtD(d));}return s/7;}
function spent7(){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);s+=smokedOn(fmtD(d));}return s*state.settings.pricePerStick;}
function avoided(){let n=0;const di=Math.max(0,diffDays(state.startDate,today()));for(let i=0;i<=di;i++){const d=parseD(state.startDate);d.setDate(d.getDate()+i);const l=limitFor(fmtD(d));n+=Math.max(0,l-smokedOn(fmtD(d)));}return n;}
function timeSavedMin(){return avoided()*MIN_PER_STICK;}
const hm=m=>Math.floor(m/60)+' ч '+(m%60)+' мин';
function savedMoney(){return avoided()*state.settings.pricePerStick;}

/* ---------- листья (валюта) ---------- */
function yest(){const d=new Date();d.setDate(d.getDate()-1);return fmtD(d);}
function accrue(){
 const g=state.garden;let cur=g.lastTick;
 if(!cur){g.lastTick=yest();return;}
 const start=state.startDate;
 if(diffDays(cur,yest())<1){return;}
 let d=parseD(cur);d.setDate(d.getDate()+1);
 let guard=0;
 while(fmtD(d)<=yest()&&guard++<400){
   const ds=fmtD(d);const s=smokedOn(ds),L=limitFor(ds);
   if(s<=L){g.leaves+=5;if(s===0)g.leaves+=5;}
   d.setDate(d.getDate()+1);
 }
 g.lastTick=yest();
}

/* ---------- темы ---------- */
function applyTheme(){document.body.dataset.theme=state.settings.theme||'dark';
 document.documentElement.style.setProperty('--acc',ACCENTS[state.settings.accent]||ACCENTS.green);}

/* ---------- звуки (реальные записи, Mixkit free license) ---------- */
const SOUNDS=[['none','🔇 Тишина'],['rain','🌧 Дождь'],['ocean','🌊 Океан'],['forest','🌲 Лес'],['night','🌙 Ночь'],['wind','💨 Ветер'],['fire','🔥 Костёр']];
let ACTX=null,ABUF={},SRC=null,GAIN=null,PLAYTOKEN=0,HBGM=null,PLAYING=false,SNDSTATUS='выключен';
function setSndStatus(m){SNDSTATUS=m;const e=document.getElementById('sndStatus');if(e)e.textContent='звук: '+m;}
function actx(){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();if(ACTX.state==='suspended')ACTX.resume().catch(()=>{});}catch(e){}return ACTX;}
function stopSound(){PLAYTOKEN++;PLAYING=false;if(SRC){try{SRC.stop();}catch(e){}SRC=null;}if(HBGM){try{HBGM.pause();HBGM.currentTime=0;}catch(e){}HBGM=null;}setSndStatus('выключен');}
async function loadBuf(t){if(!t||t==='none')return null;if(ABUF[t])return ABUF[t];
 const c=actx();if(!c)return null;
 try{const r=await fetch('assets/sounds/'+t+'.mp3');const ab=await r.arrayBuffer();

  if(c){const b=await loadBuf(t);if(my!==PLAYTOKEN)return;
   if(b){GAIN=GAIN||c.createGain();GAIN.gain.value=0.7;GAIN.connect(c.destination);
    SRC=c.createBufferSource();SRC.buffer=b;SRC.loop=true;SRC.connect(GAIN);SRC.start();
    PLAYING=true;setSndStatus('играет webaudio '+c.state);return;}
   setSndStatus('декод не удался → обычный плеер');}
  else setSndStatus('нет AudioContext → обычный плеер');
 }catch(e){setSndStatus('ошибка: '+((e&&e.message)||e));}
 try{const a=new Audio('assets/sounds/'+t+'.mp3');a.loop=true;a.volume=0.85;a.play().catch(()=>{});
  HBGM=a;PLAYING=true;setSndStatus('играет htmlaudio');}catch(e){setSndStatus('полный отказ: '+((e&&e.message)||e));}}

function addStick(n){const d=today();state.log[d]=state.log[d]||[];
 if(n<0){state.log[d].pop();haptic('light');save();render();return;}
 const left=cooldownLeft(),L=currentLimit(),early=state.settings.penaltyOn&&(left>0||L===0);
 state.log[d].push(Date.now());notifyServer();
 if(early){const p=makePenalty(left,L);state.penalties.unshift(p);haptic('heavy');save();render();showPenalty(p,L);return;}
 haptic('medium');save();render();
 const s=smokedOn(d);if(s>L)toast('⚠️ Лимит превышен на '+(s-L));else if(s===L)toast('Всё, лимит на сегодня исчерпан 🚭');else toast('Записал 👍 следующий через '+cooldownMin()+' мин');}
function randAmt(p){if(!p.max)return 0;return p.min+Math.floor(Math.random()*(Math.floor((p.max-p.min)/p.step)+1))*p.step;}
function makePenalty(l,L){const p=PENALTY_PRESETS[Math.floor(Math.random()*PENALTY_PRESETS.length)];
 return{id:Date.now()+''+Math.floor(Math.random()*1000),ts:Date.now(),k:p.k,name:p.n,unit:p.u,amt:randAmt(p),done:false,why:L===0?'стик в день «ноль»':('рано на '+(l>0?Math.ceil(l/60000):0)+' мин')};}
function showPenalty(p,L){const m=document.getElementById('modal');
 m.innerHTML='<div class="sheet"><div style="font-size:38px">⛔</div><h2>Рано!</h2>'+
 '<div class="muted">'+(L===0?'Ты на нуле — стик это срыв.':'Выкурил раньше паузы ('+cooldownMin()+' мин).')+'</div>'+
 '<div class="fine">Штраф: '+p.name+(p.amt?(' ×'+p.amt+' '+(p.unit||'')):'')+'</div>'+
 '<div style="text-align:left;margin-top:14px"><div class="muted">Что было перед этим?</div><div class="chips">'+
 TRIGGERS.map(t=>'<span class="chip" onclick="pickTrigger(this,\''+p.id+'\')">'+t+'</span>').join('')+'</div></div>'+
 '<button class="warn wide" style="margin-top:14px" onclick="closeModal()">Принял, отработаю 💪</button></div>';
 m.classList.add('on');}

function pickEmoji(el){var a=document.querySelectorAll('#we .chip');for(var k=0;k<a.length;k++)a[k].classList.remove('on');el.classList.add('on');}
function wishEdit(i){const it=i>=0?(state.wish[i]||{}):{e:'🎁',n:'',p:1000};
 const emojis=['🎁','☕','🍜','🎬','🧵','🔩','🎧','📱','💻','🖨️','🏋️','🎮','✈️','🚗','💍','🍕'];
 const m=document.getElementById('modal');
 m.innerHTML='<div class="sheet" style="text-align:left"><h2 style="text-align:center">'+(i>=0?'Изменить желание':'Новое желание')+'</h2>'+
  '<label>Название</label><input id="wn" value="'+esc(it.n)+'" placeholder="напр. Катушка PA6-CF">'+
  '<label>Цена ('+state.settings.cur+')</label><input id="wp" type="number" value="'+(it.p||0)+'">'+
  '<label>Значок</label><div class="chips" id="we">'+emojis.map(e=>'<span class="chip '+(it.e===e?'on':'')+'" onclick="pickEmoji(this)">'+e+'</span>').join('')+'</div>'+
  (i>=0?'<label style="display:flex;align-items:center;gap:9px;margin-top:12px"><input type="checkbox" id="wb" '+(it.bought?'checked':'')+' style="width:auto"> Уже куплено</label>':'')+
  '<div class="grid2" style="margin-top:16px"><button class="ghost" onclick="closeModal()">Отмена</button><button onclick="wishSave('+i+')">Сохранить</button></div></div>';
 m.classList.add('on');}
function wishSave(i){const n=document.getElementById('wn').value.trim()||'Желание';const p=Math.max(1,+document.getElementById('wp').value||1);
 const el=document.querySelector('#we .chip.on');const e=el?el.textContent:'🎁';const b=document.getElementById('wb');
 const obj={e:e,n:n,p:p,bought:b?!!b.checked:false};
 if(i>=0){if(state.wish[i]&&state.wish[i].bought)obj.bought=true;state.wish[i]=obj;}else state.wish.push(obj);
 save();closeModal();render();toast('Сохранено ⭐');}
function openWish(){const s=Math.round(savedMoney()),cur=state.settings.cur;
 const rows=WISH.slice().sort((a,b)=>a.p-b.p).map(it=>{const ok=s>=it.p,left=it.p-s,pct=Math.min(100,Math.round(s/it.p*100));
  return '<div class="wish '+(ok?'ok':'')+'"><span class="e">'+it.e+'</span><span style="flex:1">'+it.n+'<div class="muted" style="font-size:11.5px">'+(ok?'можно взять 🎉':('ещё '+left+' '+cur))+'</div>'+
   (ok?'':'<div class="bar" style="height:6px;margin-top:5px"><i style="width:'+pct+'%"></i></div>')+'</span><b>'+it.p+' '+cur+'</b></div>';}).join('');
 const m=document.getElementById('modal');
 m.innerHTML='<div class="sheet" style="text-align:left"><h2 style="text-align:center">💰 Сэкономлено: '+s+' '+cur+'</h2>'+
  '<div class="muted" style="text-align:center;margin-bottom:10px">На эти деньги можно взять:</div>'+rows+
  '<button class="ghost wide" style="margin-top:8px" onclick="closeModal();tab=\'wish\';render()">💫 Мой вишлист</button>'+
  '<button class="ghost wide" style="margin-top:8px" onclick="closeModal()">Закрыть</button></div>';m.classList.add('on');}
function copyReport(){const d=today();
 const txt='🚭 Отчёт ('+human(d)+')\nЛимит: '+currentLimit()+', сегодня: '+smokedOn(d)+
  '\nДень плана: '+(diffDays(state.startDate,d)+1)+'\nРяд под лимитом: '+streakUnder()+' дн\nБез никотина: '+daysFree()+
  ' дн\nВсего: '+total()+', не выкурено: '+avoided()+'\nВыиграно времени: '+hm(timeSavedMin())+
  '\nСэкономлено: '+Math.round(savedMoney())+' '+state.settings.cur+'\nЛистьев: '+state.garden.leaves;
 navigator.clipboard?navigator.clipboard.writeText(txt).then(()=>toast('Отчёт скопирован 📋'),()=>toast('Не вышло')):toast('Не вышло');}

/* часы-таймер */
function startCd(){clearInterval(cdTick);cdTick=setInterval(updCd,1000);updCd();}
function updCd(){const el=document.getElementById('cdtime');if(!el)return;
 const ms=cooldownLeft(),total=cooldownMs(),bar=document.getElementById('cdbar');
 if(ms<=0){el.textContent='Можно 👍';el.style.color='var(--acc)';if(bar)bar.style.width='100%';
  if(cdInit&&!cdFired){cdFired=true;try{TG&&TG.HapticFeedback&&TG.HapticFeedback.notificationOccurred('success');}catch(e){}toast('🔔 Пауза вышла — можно 🙂');}cdInit=true;return;}
 cdInit=true;cdFired=false;el.style.color='';const sec=Math.ceil(ms/1000);
 el.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);
 if(bar)bar.style.width=Math.max(0,Math.min(100,Math.round((1-ms/total)*100)))+'%';}

window.tab=tab;
try{render();}catch(e){window.__err(e.message);}
load(()=>{try{accrue();if(state.settings.theme==='auto'&&TG&&TG.colorScheme)state.settings.theme=TG.colorScheme==='light'?'light':'dark';if(!SOUNDS.some(x=>x[0]===state.settings.sound))state.settings.sound='none';applyTheme();render();}catch(e){window.__err(e.message);}});
(function(){try{fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const id=d&&d.id;if(!id||id===APP_ID)return;
 if(location.search.indexOf(id)>=0)return;if(sessionStorage.getItem('nk_upd')===id)return;
 sessionStorage.setItem('nk_upd',id);location.replace(location.pathname+'?id='+encodeURIComponent(id)+location.hash);}).catch(()=>{});}catch(e){}})();
</script>
